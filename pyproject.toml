[project]
name = "homecredit-approval"
version = "0.1.0"
description = "Home Credit Default Risk — loan approval classifier with benchmark-based routing and an agent layer for rejected-applicant offers"
authors = [
    {name = "Yanichsa Pramutjit"}
]
requires-python = "^3.12"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "xgboost (>=3.3.0,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
